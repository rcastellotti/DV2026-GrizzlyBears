name: Build Pages PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pages-preview-build-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build preview
        env:
          VITE_BASE: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: pages-preview-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
