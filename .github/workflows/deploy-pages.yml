name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export VITE_COMMIT="$(git rev-parse --short HEAD)"
          bun run build

      - name: Include stored PR previews
        run: |
          if git ls-remote --exit-code origin refs/heads/pages-previews; then
            git fetch --no-tags --depth=1 origin refs/heads/pages-previews
            git archive FETCH_HEAD pr-preview | tar -x -C dist
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
